<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Day to Day">
    <meta name="theme-color" content="#030712">
    <meta name="description" content="Day to Day — To-Do List & Password Generator in one app">
    <title>Day to Day</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=9">
</head>
<body>

<!-- ── App Header ─────────────────────────────────────── -->
<header class="app-header">
    <div class="header-brand">
        <div class="header-logo">⚡</div>
        <span class="header-title">Day to Day</span>
    </div>
    <div class="header-right">
        <span id="username-chip" class="username-chip"></span>
        <button id="notif-btn" class="icon-btn" title="Enable Due Date Notifications">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
        <a href="/static/DayToDay-App.apk" download class="icon-btn" title="Download Android App (APK)">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </a>
        <button id="logout-btn" class="icon-btn" title="Logout">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
    </div>
</header>

<!-- ── Tab Panels ─────────────────────────────────────── -->
<main class="app-main">

    <!-- TASKS TAB -->
    <section id="tab-tasks" class="tab-panel active">
        <div class="panel-inner">

            <div class="add-card">
                <h2 class="section-label">New Task</h2>
                <div class="form-stack">
                    <div class="form-row">
                        <input type="text" id="task-title" placeholder="What needs to be done?">
                        <select id="task-priority">
                            <option value="low">🟢 Low</option>
                            <option value="medium" selected>🟡 Med</option>
                            <option value="high">🔴 High</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <input type="text" id="task-desc" placeholder="Description (optional)">
                    </div>
                    <div class="form-row">
                        <div class="input-with-icon" id="date-picker-trigger">
                            <span class="input-icon">📅</span>
                            <input type="text" id="task-due" readonly placeholder="Select Date 📅" title="Click to open Graphical Calendar" data-date="">
                        </div>
                        <div class="input-with-icon" id="time-picker-trigger">
                            <span class="input-icon">⏰</span>
                            <input type="text" id="task-time" readonly placeholder="Select Time ⏰" title="Click to open Digital Clock" data-time="">
                        </div>
                    </div>
                    <div class="quick-timing-chips">
                        <button type="button" class="timing-chip" data-preset="today">Today</button>
                        <button type="button" class="timing-chip" data-preset="tomorrow">Tomorrow</button>
                        <button type="button" class="timing-chip" data-preset="1h">+1 Hr</button>
                        <button type="button" class="timing-chip" data-preset="tonight">Tonight 8 PM</button>
                    </div>
                    <button type="button" id="add-task-btn" class="primary-btn">+ Add Task</button>
                </div>
            </div>

            <div class="filter-bar">
                <div class="search-wrap">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" id="search-input" placeholder="Search tasks…">
                </div>
                <div class="pills">
                    <button class="pill active" data-priority="all">All</button>
                    <button class="pill" data-priority="high">High</button>
                    <button class="pill" data-priority="medium">Med</button>
                    <button class="pill" data-priority="low">Low</button>
                </div>
            </div>

            <div class="task-stats">
                <span id="task-count-badge" class="stat-chip">0 tasks</span>
                <button id="clear-completed-btn" class="text-danger-btn">Clear done</button>
            </div>

            <div class="task-section">
                <div class="section-head">Active <span id="active-count" class="badge">0</span></div>
                <ul id="active-tasks" class="task-list">
                    <li class="empty-state">No active tasks 🎉</li>
                </ul>
            </div>
            <div class="task-section">
                <div class="section-head">Completed <span id="completed-count" class="badge">0</span></div>
                <ul id="completed-tasks" class="task-list">
                    <li class="empty-state">Nothing yet</li>
                </ul>
            </div>
        </div>
    </section>

    <!-- PASSWORD TAB -->
    <section id="tab-password" class="tab-panel">
        <div class="panel-inner">

            <div class="pw-display-wrap">
                <div class="pw-display" id="pw-display">
                    <span id="pw-result">Tap Generate</span>
                    <button id="pw-copy-btn" class="copy-btn" title="Copy">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    </button>
                </div>
                <div class="strength-bar-wrap"><div id="strength-bar" class="strength-bar"></div></div>
                <div id="strength-label" class="strength-label"></div>
            </div>

            <div class="pw-controls">
                <div class="slider-row">
                    <div class="slider-group">
                        <label>Length <span id="length-val">16</span></label>
                        <input type="range" id="pw-length" min="8" max="64" value="16">
                    </div>
                    <div class="slider-group">
                        <label>Count <span id="count-val">1</span></label>
                        <input type="range" id="pw-count" min="1" max="10" value="1">
                    </div>
                </div>

                <div class="pw-name-group">
                    <label>Embed Name / Keyword <span class="opt-tag">(optional)</span></label>
                    <input type="text" id="pw-name" placeholder="e.g. John, Hero123" maxlength="32" autocomplete="off">
                </div>

                <div class="toggle-grid">
                    <label class="toggle-item">
                        <input type="checkbox" id="pw-upper" checked>
                        <span class="toggle-track"></span>
                        <span>Uppercase A–Z</span>
                    </label>
                    <label class="toggle-item">
                        <input type="checkbox" id="pw-lower" checked>
                        <span class="toggle-track"></span>
                        <span>Lowercase a–z</span>
                    </label>
                    <label class="toggle-item">
                        <input type="checkbox" id="pw-nums" checked>
                        <span class="toggle-track"></span>
                        <span>Numbers 0–9</span>
                    </label>
                    <label class="toggle-item">
                        <input type="checkbox" id="pw-syms" checked>
                        <span class="toggle-track"></span>
                        <span>Symbols !@#$</span>
                    </label>
                    <label class="toggle-item full-width">
                        <input type="checkbox" id="pw-noambig">
                        <span class="toggle-track"></span>
                        <span>Exclude ambiguous (0, O, l, 1)</span>
                    </label>
                </div>
            </div>

            <button id="pw-generate-btn" class="primary-btn">🔑 Generate Password</button>
            <div id="pw-error" class="error-msg"></div>

            <div id="pw-multi" class="pw-multi hidden"></div>

            <div class="history-section">
                <div class="section-head">
                    Recent <span id="clear-history" class="text-link">Clear</span>
                </div>
                <ul id="pw-history" class="history-list">
                    <li class="empty-state">No history yet</li>
                </ul>
            </div>
        </div>
    </section>

</main>

<!-- ── Bottom Navigation ──────────────────────────────── -->
<nav class="bottom-nav">
    <button class="nav-btn active" data-tab="tasks" id="nav-tasks">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span>Tasks</span>
    </button>
    <button class="nav-btn" data-tab="password" id="nav-password">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>Password</span>
    </button>
</nav>

<!-- ── CUSTOM GRAPHICAL CALENDAR MODAL ── -->
<div id="calendar-modal" class="custom-modal hidden">
    <div class="modal-overlay" id="cal-overlay"></div>
    <div class="modal-card glass-modal">
        <div class="modal-header">
            <button type="button" class="icon-btn" id="cal-prev-month">◀</button>
            <span id="cal-month-year-title" class="modal-title">August 2026</span>
            <button type="button" class="icon-btn" id="cal-next-month">▶</button>
        </div>
        <div class="calendar-days-header">
            <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
        </div>
        <div id="calendar-grid" class="calendar-grid"></div>
        <div class="modal-footer">
            <button type="button" class="timing-chip" id="cal-today-btn">Today</button>
            <button type="button" class="timing-chip" id="cal-clear-btn">Clear</button>
            <button type="button" class="primary-btn-sm" id="cal-close-btn">Done</button>
        </div>
    </div>
</div>

<!-- ── CUSTOM DIGITAL CLOCK MODAL ── -->
<div id="clock-modal" class="custom-modal hidden">
    <div class="modal-overlay" id="clock-overlay"></div>
    <div class="modal-card glass-modal clock-modal-card">
        <div class="clock-display-header">
            <span class="modal-title">⏰ Digital Clock</span>
            <div class="digital-time-banner">
                <span id="clock-display-hh">02</span>:<span id="clock-display-mm">30</span>
                <span id="clock-display-ampm" class="ampm-badge">PM</span>
            </div>
        </div>
        
        <div class="clock-selectors">
            <div class="selector-group">
                <label>Hour</label>
                <div class="spin-buttons">
                    <button type="button" class="spin-btn" id="hour-up">▲</button>
                    <span id="hour-val" class="spin-val">02</span>
                    <button type="button" class="spin-btn" id="hour-down">▼</button>
                </div>
            </div>
            <div class="selector-colon">:</div>
            <div class="selector-group">
                <label>Minute</label>
                <div class="spin-buttons">
                    <button type="button" class="spin-btn" id="min-up">▲</button>
                    <span id="min-val" class="spin-val">30</span>
                    <button type="button" class="spin-btn" id="min-down">▼</button>
                </div>
            </div>
            <div class="selector-group ampm-group">
                <label>Format</label>
                <div class="ampm-toggle">
                    <button type="button" class="ampm-btn" id="ampm-am">AM</button>
                    <button type="button" class="ampm-btn active" id="ampm-pm">PM</button>
                </div>
            </div>
        </div>

        <div class="clock-quick-minutes">
            <button type="button" class="timing-chip quick-min" data-m="00">:00</button>
            <button type="button" class="timing-chip quick-min" data-m="15">:15</button>
            <button type="button" class="timing-chip quick-min" data-m="30">:30</button>
            <button type="button" class="timing-chip quick-min" data-m="45">:45</button>
        </div>

        <div class="modal-footer">
            <button type="button" class="timing-chip" id="clock-now-btn">Current Time</button>
            <button type="button" class="timing-chip" id="clock-clear-btn">Clear</button>
            <button type="button" class="primary-btn-sm" id="clock-set-btn">Set Time</button>
        </div>
    </div>
</div>

<script src="/static/app.js?v=10"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
  }
</script>
</body>
</html>
